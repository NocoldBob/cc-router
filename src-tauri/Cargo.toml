[package]
name = "cc-router"
version = "0.3.0"
description = "Local Claude Code route manager for Windows and Ubuntu"
authors = ["CC Router contributors"]
license = "MIT"
repository = "https://github.com/NocoldBob/cc-router"
edition = "2021"
rust-version = "1.77.2"
default-run = "cc-router"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
